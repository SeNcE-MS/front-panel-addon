name: Front Panel Beta
version: "1.1.0-beta.29"
slug: front_panel_beta
description: Music Assistant 시험 베타
stage: experimental
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
ingress_entry: editor
panel_icon: mdi:music-box-multiple
panel_title: Front Panel Beta
homeassistant_api: true
hassio_api: true
hassio_role: default
host_network: false
apparmor: true
