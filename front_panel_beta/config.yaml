  8099/tcp: 18765
ports_description:
  8099/tcp: 베타 내부망 표시 화면 (지정 IP 또는 지정 내부망 허용, 인터넷 공개 금지)
options:
  viewer_ip: ""
  viewer_network: ""
schema:
  viewer_ip: str
  viewer_network: str
  music_assistant_url: str?
  music_assistant_ingress_path: str?
  music_api_url: str?
  music_api_token: password?
